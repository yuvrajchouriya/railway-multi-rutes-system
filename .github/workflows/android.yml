name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Next.js Static Export for Android
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=https://www.railsathi.in" >> .env.production
          rm -rf src/app/api
          cp next.config.ts next.config.ts.bak
          echo 'import type { NextConfig } from "next"; const nextConfig: NextConfig = { output: "export", images: { unoptimized: true }, typescript: { ignoreBuildErrors: true }, eslint: { ignoreDuringBuilds: true } }; export default nextConfig;' > next.config.ts
          npm run build
          mv next.config.ts.bak next.config.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'dummy-key'
          API_SECRET_KEY: 'dummy-secret'

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap update android

      - name: Build APK (Debug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build AAB (Release)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
