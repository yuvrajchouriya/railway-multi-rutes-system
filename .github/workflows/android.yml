name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Next.js Static Export for Android
        run: |
          rm -rf src/app/api
          echo "NEXT_PUBLIC_API_BASE_URL=https://www.railsathi.in" > .env.production
          cp next.config.ts next.config.ts.bak
          echo 'import type { NextConfig } from "next"; const nextConfig: NextConfig = { output: "export", images: { unoptimized: true }, typescript: { ignoreBuildErrors: true }, eslint: { ignoreDuringBuilds: true } }; export default nextConfig;' > next.config.ts
          npm run build
          mv next.config.ts.bak next.config.ts
        env:
          NEXT_PUBLIC_API_BASE_URL: 'https://www.railsathi.in'
          NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'dummy-key'
          API_SECRET_KEY: 'dummy-secret'

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap update android

      - name: Build APK (Debug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Generate Keystore if not exists
        working-directory: ./android/app
        run: |
          if [ ! -f railsathi.keystore ]; then
            keytool -genkey -v -keystore railsathi.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass railsathipass -keypass railsathipass -dname "CN=RailSathi, OU=RailSathi, O=RailSathi, L=India, ST=India, C=IN"
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git add railsathi.keystore
            git commit -m "chore: generated android keystore for Play Store signing"
            git push origin main
          fi

      - name: Build AAB (Release)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
